<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCADA — Control de Nivel</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0a0e14;
      --panel:    #111820;
      --border:   #1e2d3d;
      --accent:   #00d4ff;
      --green:    #00ff88;
      --yellow:   #ffd600;
      --red:      #ff4444;
      --text:     #c9d8e8;
      --muted:    #4a6278;
      --font-mono: 'Share Tech Mono', monospace;
      --font-body: 'Barlow', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,212,255,0.015) 2px,
        rgba(0,212,255,0.015) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-badge {
      width: 36px; height: 36px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
    }

    header p {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 1.5s ease-in-out infinite;
    }

    .dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #clock {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
    }

    /* Main layout */
    .main {
      padding: 24px 32px;
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: auto 1fr;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* KPI cards column */
    .kpi-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      grid-row: 1 / 3;
    }

    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
    }

    .kpi-card.green::before { background: var(--green); }
    .kpi-card.yellow::before { background: var(--yellow); }
    .kpi-card.red::before { background: var(--red); }

    .kpi-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .kpi-value {
      font-family: var(--font-mono);
      font-size: 36px;
      font-weight: 400;
      color: var(--accent);
      line-height: 1;
      transition: color 0.3s;
    }

    .kpi-card.green .kpi-value { color: var(--green); }
    .kpi-card.yellow .kpi-value { color: var(--yellow); }

    .kpi-unit {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      font-family: var(--font-mono);
    }

    /* Tank visual */
    .tank-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .tank-outer {
      width: 60px;
      height: 100px;
      border: 2px solid var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      background: rgba(0,212,255,0.03);
    }

    .tank-fill {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,212,255,0.6), rgba(0,212,255,0.2));
      transition: height 0.8s ease;
      height: 0%;
    }

    .tank-pct {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* Charts area */
    .charts-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chart-legend {
      display: flex;
      gap: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .legend-dot {
      width: 8px; height: 2px;
      border-radius: 1px;
    }

    canvas { width: 100% !important; }

    /* Table */
    .table-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      grid-column: 1 / 3;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .table-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .record-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
      max-height: 260px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    thead {
      position: sticky;
      top: 0;
      background: var(--panel);
    }

    th {
      text-align: left;
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(30,45,61,0.5);
      color: var(--text);
      transition: background 0.2s;
    }

    tr:hover td { background: rgba(0,212,255,0.03); }

    tr:first-child td { color: var(--accent); }

    .tag-sp    { color: var(--yellow); }
    .tag-nivel { color: var(--accent); }
    .tag-rpm   { color: var(--green); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-badge">PLC</div>
    <div>
      <h1>Sistema de Control de Nivel</h1>
      <p>SUPERVISIÓN EN TIEMPO REAL — UMNG</p>
    </div>
  </div>
  <div class="status-bar">
    <div class="status-dot">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-label">CONECTADO</span>
    </div>
    <div id="clock">--:--:--</div>
  </div>
</header>

<div class="main">

  <!-- KPI Column -->
  <div class="kpi-col">

    <div class="kpi-card yellow">
      <div class="kpi-label">Setpoint (SP)</div>
      <div class="kpi-value" id="val-sp">—</div>
      <div class="kpi-unit">cm</div>
    </div>

    <div class="kpi-card">
      <div class="kpi-label">Nivel</div>
      <div class="kpi-value" id="val-nivel">—</div>
      <div class="kpi-unit">cm</div>
      <div class="tank-wrap">
        <div class="tank-outer">
          <div class="tank-fill" id="tank-fill"></div>
        </div>
        <div class="tank-pct" id="tank-pct">0%</div>
      </div>
    </div>

    <div class="kpi-card green">
      <div class="kpi-label">RPM Variador</div>
      <div class="kpi-value" id="val-rpm">—</div>
      <div class="kpi-unit">rpm</div>
    </div>

    <div class="kpi-card" style="margin-top:auto;">
      <div class="kpi-label">Último registro</div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px;" id="last-ts">—</div>
    </div>

  </div>

  <!-- Charts -->
  <div class="charts-area">
    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">Nivel vs Setpoint</span>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Nivel</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>SP</div>
        </div>
      </div>
      <canvas id="chart-nivel" height="140"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span class="chart-title">RPM Variador</span>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>RPM</div>
        </div>
      </div>
      <canvas id="chart-rpm" height="110"></canvas>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <span class="table-title">Historial de Registros</span>
      <span class="record-count" id="rec-count">0 registros</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Timestamp</th>
            <th>SP (cm)</th>
            <th>Nivel (cm)</th>
            <th>RPM</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="5" style="color:var(--muted);text-align:center;padding:24px;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // ── Configuración Supabase ──────────────────────────────
  const SUPABASE_URL     = "https://tzmvrhqsctdcmguhjqaq.supabase.co";
  const SUPABASE_API_KEY = "sb_secret_cyeHICnWfSs9YSf0TNWsew_9Hn1GMnR";
  const TABLA            = "proceso_nivel";
  const LIMITE           = 50;
  const INTERVALO_MS     = 1000;
  // ────────────────────────────────────────────────────────

  // ── Chart.js setup ─────────────────────────────────────
  const commonOpts = {
    responsive: true,
    animation: { duration: 300 },
    plugins: { legend: { display: false }, tooltip: {
      backgroundColor: '#111820',
      borderColor: '#1e2d3d',
      borderWidth: 1,
      titleColor: '#c9d8e8',
      bodyColor: '#4a6278',
      titleFont: { family: 'Share Tech Mono', size: 11 },
      bodyFont:  { family: 'Share Tech Mono', size: 11 },
    }},
    scales: {
      x: { ticks: { color: '#4a6278', font: { family: 'Share Tech Mono', size: 9 }, maxTicksLimit: 8 }, grid: { color: '#1e2d3d' } },
      y: { ticks: { color: '#4a6278', font: { family: 'Share Tech Mono', size: 10 } }, grid: { color: '#1e2d3d' } }
    }
  };

  const ctxNivel = document.getElementById('chart-nivel').getContext('2d');
  const chartNivel = new Chart(ctxNivel, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Nivel', data: [], borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.05)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true },
        { label: 'SP',    data: [], borderColor: '#ffd600', backgroundColor: 'transparent',           borderWidth: 1.5, pointRadius: 0, borderDash: [4,4], tension: 0 }
      ]
    },
    options: commonOpts
  });

  const ctxRpm = document.getElementById('chart-rpm').getContext('2d');
  const chartRpm = new Chart(ctxRpm, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'RPM', data: [], borderColor: '#00ff88', backgroundColor: 'rgba(0,255,136,0.05)', borderWidth: 2, pointRadius: 2, tension: 0.3, fill: true }
      ]
    },
    options: commonOpts
  });

  // ── Clock ───────────────────────────────────────────────
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-CO');
  }, 1000);

  // ── Fetch data ──────────────────────────────────────────
  async function fetchData() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/${TABLA}?select=*&order=timestamp.desc&limit=${LIMITE}`,
        { headers: { apikey: SUPABASE_API_KEY, Authorization: `Bearer ${SUPABASE_API_KEY}` } }
      );
      if (!res.ok) throw new Error(res.status);
      const rows = await res.json();
      updateUI(rows);
      setOnline(true);
    } catch (e) {
      console.error(e);
      setOnline(false);
    }
  }

  function setOnline(online) {
    const dot   = document.getElementById('conn-dot');
    const label = document.getElementById('conn-label');
    dot.className   = online ? 'dot' : 'dot offline';
    label.textContent = online ? 'CONECTADO' : 'SIN CONEXIÓN';
  }

  function fmt(ts) {
    return new Date(ts).toLocaleTimeString('es-CO', { hour12: false });
  }

  function fmtFull(ts) {
    return new Date(ts).toLocaleString('es-CO', { hour12: false });
  }

  function updateUI(rows) {
    if (!rows.length) return;

    const latest = rows[0];

    // KPIs
    document.getElementById('val-sp').textContent    = latest.sp    != null ? Number(latest.sp).toFixed(1)    : '—';
    document.getElementById('val-nivel').textContent = latest.nivel != null ? Number(latest.nivel).toFixed(1) : '—';
    document.getElementById('val-rpm').textContent   = latest.rpm   != null ? Number(latest.rpm).toFixed(0)   : '—';
    document.getElementById('last-ts').textContent   = fmtFull(latest.timestamp);

    // Tank (asume max 100 cm)
    const pct = Math.min(100, Math.max(0, (latest.nivel / 100) * 100));
    document.getElementById('tank-fill').style.height = pct + '%';
    document.getElementById('tank-pct').textContent   = pct.toFixed(0) + '%';

    // Charts — invertir para orden cronológico
    const reversed = [...rows].reverse();
    const labels   = reversed.map(r => fmt(r.timestamp));
    const niveles  = reversed.map(r => r.nivel ?? 0);
    const sps      = reversed.map(r => r.sp ?? 0);
    const rpms     = reversed.map(r => r.rpm ?? 0);

    chartNivel.data.labels            = labels;
    chartNivel.data.datasets[0].data  = niveles;
    chartNivel.data.datasets[1].data  = sps;
    chartNivel.update();

    chartRpm.data.labels           = labels;
    chartRpm.data.datasets[0].data = rpms;
    chartRpm.update();

    // Tabla
    document.getElementById('rec-count').textContent = `${rows.length} registros`;
    const tbody = document.getElementById('tabla-body');
    tbody.innerHTML = rows.map((r, i) => `
      <tr class="${i === 0 ? 'fade-in' : ''}">
        <td style="color:var(--muted)">${r.id}</td>
        <td style="color:var(--muted)">${fmtFull(r.timestamp)}</td>
        <td class="tag-sp">${r.sp    != null ? Number(r.sp).toFixed(1)    : '—'}</td>
        <td class="tag-nivel">${r.nivel != null ? Number(r.nivel).toFixed(1) : '—'}</td>
        <td class="tag-rpm">${r.rpm   != null ? Number(r.rpm).toFixed(0)   : '—'}</td>
      </tr>
    `).join('');
  }

  // ── Start ───────────────────────────────────────────────
  fetchData();
  setInterval(fetchData, INTERVALO_MS);
</script>
</body>
</html>
